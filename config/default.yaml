application:
  name: "Automation biên mục tài liệu"
  version: "0.1.27.4.19"
browser:
  base_url: "https://kholuutru-khoidang.tphcm.gov.vn/DocumentCataloging"
  channel: ""
  headless: false
  timeout_ms: 30000
  manual_login_timeout_ms: 600000
  profile_dir: "%LOCALAPPDATA%/KhoLuuTruAutomation/slot1/profile"
  profile_dir_slot2: "%LOCALAPPDATA%/KhoLuuTruAutomation/slot2/profile"
  downloads_dir: "runtime/downloads"

pdf:
  render_dpi: 300
  max_pages_for_header: 1
  minimum_text_length: 80
  fast_viewer_fallback: true
  viewer_ready_timeout_ms: 1800
  direct_viewer_image: true

ocr:
  enabled: true
  language: "vi"
  minimum_confidence: 0.82
  device: "cpu"
  enable_mkldnn: false
  cpu_threads: 4
  text_detection_model_name: "PP-OCRv5_mobile_det"
  text_recognition_model_name: "latin_PP-OCRv5_mobile_rec"
  use_doc_orientation_classify: false
  use_doc_unwarping: false
  use_textline_orientation: false
  use_tesseract_fallback: true
  tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"
  fallback_policy: "on_demand"
  paddle_accept_score: 0.78
  paddle_accept_vietnamese_quality: 0.62
  tesseract_accept_score: 0.64
  tesseract_max_variants: 2
  reuse_ocr_cache: true

workflow:
  max_attempts: 2
  continue_after_record_error: true
  auto_complete: true
  dry_run: false

cataloging_defaults:
  author: ""
  security_level: "Thường"
