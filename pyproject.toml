[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cataloging-automation-v2"
version = "0.1.27.4.19"
description = "Lightweight document cataloging automation using Playwright, PaddleOCR, PyMuPDF, PySide6 and SQLite"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Internal Automation Team"}]
dependencies = [
  "PyYAML>=6.0,<7",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
browser = ["playwright>=1.48,<2"]
ui = ["PySide6>=6.8,<7"]
ocr = ["paddleocr==3.3.2", "paddlex[ocr-core]==3.3.13", "paddlepaddle==3.2.2", "opencv-contrib-python==4.10.0.84"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "pyright>=1.1,<2", "pyinstaller>=6,<7"]
full = [
  "playwright>=1.48,<2",
  "PySide6>=6.8,<7",
  "paddleocr==3.3.2",
  "paddlex[ocr-core]==3.3.13",
  "paddlepaddle==3.2.2",
  "opencv-contrib-python==4.10.0.84",
]

[project.scripts]
cataloging-tool = "cataloging_tool.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "runtime", "backup", "backups", "build", "dist", "release"]
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src"]
exclude = [".venv", "runtime", "backup", "backups", "build", "dist", "release", "**/__pycache__"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
